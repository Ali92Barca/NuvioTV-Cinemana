name: TV source baseline check
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare-tv.sh'
      - '.github/workflows/tv-source-check.yml'
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official NuvioTV 1.0.0 source
        run: bash scripts/prepare-tv.sh
      - name: Apply independent TV identity
        run: python3 scripts/apply-tv-identity.py .work/NuvioTV
      - name: Verify independent identity
        run: |
          grep -F 'applicationId = "com.ali92barca.nuviotv.cinemana"' .work/NuvioTV/app/build.gradle.kts
          grep -F 'versionName = "1.0.0-cinemana.1"' .work/NuvioTV/app/build.gradle.kts
      - name: Validate TV configuration
        run: python3 scripts/check-tv-config.py .work/NuvioTV
      - name: Confirm baseline
        run: |
          test -f .work/NuvioTV/app/build.gradle.kts
          git -C .work/NuvioTV describe --tags --exact-match
          echo "Source check passed. No APK built."
