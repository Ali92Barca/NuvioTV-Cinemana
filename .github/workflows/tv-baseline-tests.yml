name: Official 1.0.0 baseline test comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/prepare-baseline-tests.py', '.github/workflows/tv-baseline-tests.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTV
          ref: 9f17e8bf4abc799dc8c832d2894a8b3b166e4353
          path: upstream
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 integration/scripts/prepare-baseline-tests.py upstream
      - name: Test unmodified official runtime
        working-directory: upstream
        run: |
          touch local.properties
          ./gradlew :app:testFullDebugUnitTest --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tv-baseline-test-reports
          path: |
            upstream/app/build/test-results/**
            upstream/app/build/reports/tests/**
          if-no-files-found: error
