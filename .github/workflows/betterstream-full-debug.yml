name: Better Stream full debug with services
on:
  push:
    branches: [experimental/betterstream-tmdb]
    paths:
      - '.github/workflows/betterstream-full-debug.yml'
      - 'app/**'
      - 'gradle.properties'
      - 'scripts/configure-services.py'
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[release-candidate]')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure registered services
        env:
          REQUIRE_REGISTRATIONS: 'true'
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: python3 scripts/configure-services.py local.properties
      - name: Generate and verify full debug configuration
        run: |
          chmod +x gradlew
          ./gradlew :app:generateFullDebugBuildConfig --no-daemon
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = next(Path('app/build/generated/source/buildConfig').rglob('BuildConfig.java')).read_text()
          required = ['SUPABASE_URL', 'SUPABASE_ANON_KEY', 'TRAKT_CLIENT_ID', 'SIMKL_CLIENT_ID', 'TMDB_API_KEY']
          for key in required:
              match = re.search(r'\b' + key + r'\s*=\s*"([^"]*)"', text)
              if not match or not match[1].strip():
                  raise SystemExit('Missing generated service configuration: ' + key)
              print(key + ': configured')
          PY
      - name: Test integrations and build full APK
        run: |
          ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.android.cinemana.CinemanaBilingualIdentityTest' --tests 'com.nuvio.android.cinemana.CinemanaPersistentMatchPolicyTest' --tests 'com.nuvio.tv.data.repository.TmdbMetadataFallbackTest' --tests 'com.nuvio.tv.data.remote.supabase.AvatarCatalogRefreshTest' --tests 'com.nuvio.tv.data.offline.*Test' --tests 'com.nuvio.tv.data.builtincache.BuiltinPrefetchTest' --tests 'com.nuvio.tv.data.cee.CeeSeriesTest' --tests 'com.nuvio.tv.core.network.ProviderHttpAwaitTest' --tests 'com.nuvio.tv.ui.screens.home.ContinueWatchingBuiltinPrefetchTest' --tests 'com.nuvio.tv.ui.screens.detail.DownloadEpisodeFocusTest' --tests 'com.nuvio.tv.data.repository.AddonManifestPlaceholderTest' --tests 'com.nuvio.android.cinemana.CinemanaStreamConcurrencyTest' --tests 'com.nuvio.android.cinemana.CinemanaEditionResolutionTest' --tests 'com.nuvio.android.cinemana.CinemanaEpisodeMappingRegressionTest' --tests 'com.nuvio.tv.ui.components.BuiltinCatalogPosterTest' --tests 'com.nuvio.tv.ui.components.ProgressiveIptvPosterTest' --tests 'com.nuvio.tv.data.iptv.*' --tests 'com.nuvio.tv.data.repository.StreamRepositoryPluginIsolationTest' --tests 'com.nuvio.tv.data.repository.StreamRequestRecoveryTest' --tests 'com.nuvio.tv.data.builtincache.BuiltinDetailsStoreUpgradeTest' --tests 'com.nuvio.tv.data.repository.StreamSearchSessionCacheTest' --tests 'com.nuvio.tv.data.repository.MetaRepositoryAddonCacheTest' --tests 'com.nuvio.tv.data.repository.SharedPlaybackIdentityTest' --tests 'com.nuvio.tv.data.repository.SharedMetadataRequestTest' --tests 'com.nuvio.tv.data.repository.HistoryProjectionCacheTest' --tests 'com.nuvio.tv.core.sync.WatchState*Test' --tests 'com.nuvio.tv.core.sync.WatchedDeltaReconciliationTest' --tests 'com.nuvio.tv.data.local.WatchedItems*Test' --tests 'com.nuvio.tv.data.local.WatchProgressPreferencesStorageTest' --tests 'com.nuvio.tv.ui.screens.home.ContinueWatching*Test' --tests 'com.nuvio.tv.ui.screens.home.WatchedSeriesBadgeReconciliationTest' --tests 'com.nuvio.tv.ui.screens.detail.EpisodeWatchedProjectionTest' --tests 'com.nuvio.tv.ui.screens.player.PlayerDisplayIdentityTest' --tests 'com.nuvio.tv.data.local.WatchedSeriesStateHolderProfileTest' --tests 'com.nuvio.tv.data.repository.WatchProgressRepositoryProfileIsolationTest' --tests 'com.nuvio.tv.data.repository.TraktAuthServiceTest' :app:assembleFullDebug --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
      - name: Retain private unpublished test APK and reports
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VARIANT: debug
          CANDIDATE_BUILD_STATUS: ${{ job.status }}
        run: python3 scripts/store_release_candidate.py
      - name: Remove temporary service properties
        if: always()
        run: rm -f local.properties local.dev.properties
