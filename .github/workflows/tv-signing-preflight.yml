name: TV signing and registration preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tv-signing-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository secret availability without exposing values
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          names = ['MOBILE_KEYSTORE_BASE64', 'MOBILE_STORE_PASSWORD', 'MOBILE_KEY_ALIAS', 'MOBILE_KEY_PASSWORD', 'TRAKT_CLIENT_ID', 'TRAKT_CLIENT_SECRET', 'TMDB_API_KEY']
          missing = []
          for name in names:
              present = bool(os.environ.get(name))
              print(name + ': ' + ('available' if present else 'missing'))
              if not present: missing.append(name)
          if missing: raise SystemExit('TV repository signing/registration secrets are incomplete; reuse existing mobile values in this repository. Never send them in chat.')
          PY
      - name: Verify supplied mobile keystore and private-key password
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/tv-preflight.jks"
          python3 scripts/prepare-signing.py
          keytool -certreq -keystore "$NUVIO_RELEASE_STORE_FILE" -alias "$NUVIO_RELEASE_KEY_ALIAS" -storepass:env NUVIO_RELEASE_STORE_PASSWORD -keypass:env NUVIO_RELEASE_KEY_PASSWORD -file "$RUNNER_TEMP/tv-preflight.csr" >/dev/null
          echo "Supplied signing keystore and key password validated; no release certificate was generated."
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tv-preflight.jks" "$RUNNER_TEMP/tv-preflight.csr"
